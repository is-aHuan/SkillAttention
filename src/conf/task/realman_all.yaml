# conf/task/realman_all.yaml
name: realman_all

expert_location: ["/home/lyh/data_folder/dataspace/lorel/may_08_sawyer_50k/realman.pkl",
                  "/home/lyh/data_folder/dataspace/lorel/may_08_sawyer_50k/dataset2.pkl",
                  "/home/lyh/data_folder/dataspace/lorel/may_08_sawyer_50k/dataset3.pkl"]
memmap_dir: "/home/lyh/data_folder/dataspace/lorel/may_08_sawyer_50k/memmap_cache"

# "all": use all tasks, otherwise use specific task
task_lang: "all"
# task_lang: "all"
subsample_frequency: 1
normalize_obs: True
no_lang: False
force_rebuild: False

# horizon, proprio_dim, action_dim 
horizon: 16
proprio_dim: 8        # pose(3) + quat(4) + grip(1)
action_dim: 10        # action = pos(3) + rot6d(6) + grip(1)

env_name: "RealMan"
skip_words: ['go', 'to', 'the', 'a', '[SEP]']
